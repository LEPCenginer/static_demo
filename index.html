<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Recommendation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Crop Recommendation System</h1>
        <form id="cropForm">
            <label>Nitrogen (N): <input type="number" step="any" name="N" required></label>
            <label>Phosphorus (P): <input type="number" step="any" name="P" required></label>
            <label>Potassium (K): <input type="number" step="any" name="K" required></label>
            <label>Temperature (°C): <input type="number" step="any" name="temperature" required></label>
            <label>Humidity (%): <input type="number" step="any" name="humidity" required></label>
            <label>pH: <input type="number" step="any" name="ph" required></label>
            <label>Rainfall (mm): <input type="number" step="any" name="rainfall" required></label>
            <div class="model-select">
                <label><input type="radio" name="model" value="rf" checked> RandomForest</label>
                <label><input type="radio" name="model" value="svm"> SVM</label>
            </div>
            <button type="submit">Get Recommendation</button>
        </form>
        <div id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
